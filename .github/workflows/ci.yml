name: Live2D Mascot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd
          coverage: none
      - name: Install pinned build tools from npm lockfile
        run: npm ci --ignore-scripts
      - name: Verify fixtures, syntax, rebuild and asset-free source/install packages
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          args=(--source-sha "$SOURCE_SHA" --require-clean --out build/ci-release)
          if [ -n "$RELEASE_VERSION" ]; then args+=(--version "$RELEASE_VERSION"); fi
          python3 tools/ci.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-live2d-mascot-release-${{ inputs.source_sha || github.sha }}
          path: build/ci-release/*
          if-no-files-found: error
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd, mbstring
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real pinned WordPress install/upgrade and HTTP administrator forms
        env:
          MASCOT_CI_DB_NAME: mascot_ci_integration
          MASCOT_CI_DB_HOST: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
          MASCOT_CI_DB_USER: root
          MASCOT_CI_DB_PASSWORD: synthetic-ci-only
        run: python3 tools/wordpress-integration.py --lab /tmp/mascot-ci-integration
      - name: Preserve summary only (no fixtures, Core, models, passwords or cookies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-wordpress-${{ matrix.php }}-${{ inputs.source_sha || github.sha }}
          path: /tmp/mascot-ci-integration/results.json
          if-no-files-found: ignore
          retention-days: 14

  browser:
    # Match the Ubuntu release supported by the pinned Playwright browser.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned development dependencies
        timeout-minutes: 3
        run: npm ci --ignore-scripts
      - name: Install Chromium system dependencies from the Ubuntu archive
        id: system_dependencies
        timeout-minutes: 8
        run: |
          trap 'status=$?; echo "elapsed_seconds=$SECONDS" >> "$GITHUB_OUTPUT"; exit "$status"' EXIT
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_ENVIRONMENT,ImageOS python3 tools/ci_browser_sources.py
          npx --no-install playwright install-deps chromium
      - name: Download the Chromium revision matched to Playwright 1.55.1
        id: chromium_download
        timeout-minutes: 4
        run: |
          trap 'status=$?; echo "elapsed_seconds=$SECONDS" >> "$GITHUB_OUTPUT"; exit "$status"' EXIT
          npx --no-install playwright install chromium
      - name: Whole-page and specialized browser regressions (synthetic engine, loopback only)
        id: browser_tests
        timeout-minutes: 10
        run: |
          trap 'status=$?; echo "elapsed_seconds=$SECONDS" >> "$GITHUB_OUTPUT"; exit "$status"' EXIT
          npm run test:browser -- --out build/browser
          for suite in dialogue movement account selection capture; do
            mkdir -p "build/browser/$suite"
            node "tests/$suite-browser.cjs" "build/browser/$suite" > "build/browser/$suite/summary.tmp"
            python3 -m json.tool "build/browser/$suite/summary.tmp" > /dev/null
            mv "build/browser/$suite/summary.tmp" "build/browser/$suite/results.json"
          done
      - name: Report browser stage outcomes and elapsed time
        if: always()
        env:
          SYSTEM_OUTCOME: ${{ steps.system_dependencies.outcome }}
          SYSTEM_SECONDS: ${{ steps.system_dependencies.outputs.elapsed_seconds }}
          DOWNLOAD_OUTCOME: ${{ steps.chromium_download.outcome }}
          DOWNLOAD_SECONDS: ${{ steps.chromium_download.outputs.elapsed_seconds }}
          TEST_OUTCOME: ${{ steps.browser_tests.outcome }}
          TEST_SECONDS: ${{ steps.browser_tests.outputs.elapsed_seconds }}
        run: |
          {
            echo '| Browser stage | Outcome | Elapsed seconds |'
            echo '| --- | --- | --- |'
            echo "| Ubuntu system dependencies | $SYSTEM_OUTCOME | ${SYSTEM_SECONDS:-not recorded} |"
            echo "| Chromium download | $DOWNLOAD_OUTCOME | ${DOWNLOAD_SECONDS:-not recorded} |"
            echo "| Browser regressions | $TEST_OUTCOME | ${TEST_SECONDS:-not recorded} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic browser summaries and selected screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-browser-${{ inputs.source_sha || github.sha }}
          path: |
            build/browser/results.json
            build/browser/*.png
            build/browser/dialogue/results.json
            build/browser/dialogue/*.png
            build/browser/movement/results.json
            build/browser/movement/*.png
            build/browser/account/results.json
            build/browser/account/*.png
            build/browser/selection/results.json
            build/browser/selection/*.png
            build/browser/capture/results.json
            build/browser/capture/*.png
          if-no-files-found: ignore
          retention-days: 14
