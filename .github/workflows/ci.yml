name: Live2D Mascot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, gd
          coverage: none
      - name: Install pinned build tools from npm lockfile
        run: npm ci --ignore-scripts
      - name: Verify fixtures, syntax, rebuild and asset-free source/install packages
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          args=(--source-sha "$SOURCE_SHA" --require-clean --out build/ci-release)
          if [ -n "$RELEASE_VERSION" ]; then args+=(--version "$RELEASE_VERSION"); fi
          python3 tools/ci.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-live2d-mascot-release-${{ inputs.source_sha || github.sha }}
          path: build/ci-release/*
          if-no-files-found: error
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd, mbstring
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real pinned WordPress install/upgrade and HTTP administrator forms
        env:
          MASCOT_CI_DB_NAME: mascot_ci_integration
          MASCOT_CI_DB_HOST: 127.0.0.1:${{ job.services.mysql.ports[3306] }}
          MASCOT_CI_DB_USER: root
          MASCOT_CI_DB_PASSWORD: synthetic-ci-only
        run: python3 tools/wordpress-integration.py --lab /tmp/mascot-ci-integration
      - name: Preserve summary only (no fixtures, Core, models, passwords or cookies)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-wordpress-${{ matrix.php }}-${{ inputs.source_sha || github.sha }}
          path: /tmp/mascot-ci-integration/results.json
          if-no-files-found: ignore
          retention-days: 14

  browser:
    # Playwright 1.55.1 supports Ubuntu 24.04; ubuntu-latest also selects 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Install the Chromium revision matched to Playwright 1.55.1
        run: npx --no-install playwright install --with-deps chromium
      - name: Whole-page browser controller regression (synthetic engine, loopback only)
        run: |
          npm run test:browser -- --out build/browser
          node tests/dialogue-browser.cjs build/browser/dialogue
          node tests/movement-browser.cjs build/browser/movement
          node tests/account-browser.cjs build/browser/account
          node tests/selection-browser.cjs build/browser/selection
          node tests/capture-browser.cjs build/browser/capture
      - name: Preserve synthetic browser summary and selected screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-browser-${{ inputs.source_sha || github.sha }}
          path: |
            build/browser/results.json
            build/browser/*.png
          if-no-files-found: ignore
          retention-days: 14
