<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">WordPress Live2D Mascot</title>
  <desc id="desc">原创抽象横幅，为阅读留出空间。</desc>
  <rect width="600" height="280" rx="20" fill="#f3f5ef"/>
  <circle cx="567" cy="61" r="110" fill="none" stroke="#d5ded1"/>
  <circle cx="567" cy="61" r="75" fill="none" stroke="#d5ded1"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="32" y="54" fill="#54735c" font-size="22" font-weight="600">LIVE2D MASCOT</text>
    <text x="30" y="130" fill="#203b2d" font-size="46" font-weight="650">为阅读，留出空间。</text>
    <text x="32" y="180" fill="#526057" font-size="26">选择喜欢的角色，</text>
    <text x="32" y="218" fill="#526057" font-size="26">让互动恰到好处。</text>
  </g>
</svg>
