<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc">
<title id="title">从准备资源到安心阅读</title><desc id="desc">原创流程示意，不是实际界面截图。</desc>
<rect width="600" height="750" rx="16" fill="#f5f6f2"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect x="20" y="20" width="560" height="166" rx="12" fill="#fff" stroke="#d8e0d3"/>
<text x="44" y="56" fill="#54735c" font-size="23" font-weight="600">01 / 管理员准备</text>
<text x="44" y="108" fill="#203b2d" font-size="34" font-weight="600">导入自己的资源</text>
<text x="44" y="152" fill="#59665d" font-size="26">Core 与单模型 ZIP</text>
<rect x="20" y="200" width="560" height="166" rx="12" fill="#fff" stroke="#d8e0d3"/>
<text x="44" y="236" fill="#54735c" font-size="23" font-weight="600">02 / 读者选择</text>
<text x="44" y="288" fill="#203b2d" font-size="34" font-weight="600">同意条款并显示</text>
<text x="44" y="332" fill="#59665d" font-size="26">显示偏好由读者决定</text>
<rect x="20" y="380" width="560" height="166" rx="12" fill="#fff" stroke="#d8e0d3"/>
<text x="44" y="416" fill="#54735c" font-size="23" font-weight="600">03 / 预览确认</text>
<text x="44" y="468" fill="#203b2d" font-size="34" font-weight="600">找到喜欢的角色</text>
<text x="44" y="512" fill="#59665d" font-size="26">先预览，再保存选择</text>
<rect x="20" y="560" width="560" height="166" rx="12" fill="#fff" stroke="#d8e0d3"/>
<text x="44" y="596" fill="#54735c" font-size="23" font-weight="600">04 / 继续阅读</text>
<text x="44" y="648" fill="#203b2d" font-size="34" font-weight="600">需要时让出空间</text>
<text x="44" y="692" fill="#59665d" font-size="26">支持的阅读面板打开即暂停</text>
</g></svg>
